apiVersion: v1
kind: Service
metadata:
  name: devops-enterprise-api-service
  namespace: prod
  labels:
    app: devops-enterprise-api
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: devops-enterprise-api
    version: blue   # <--- CAMBIA A 'green' CUANDO SE APRUEBE EL DESPLIEGUE EN JENKINS